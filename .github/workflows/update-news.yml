name: Auto Actualizar Noticias

on:
  schedule:
    # Se ejecuta automáticamente cada 2 horas en el minuto 17 (fallback nativo)
    - cron: '17 */2 * * *'
  workflow_dispatch: # Permite disparar la automatización manualmente desde GitHub
  repository_dispatch: # Permite disparar la automatización externamente (cron-job.org, Webhook, API) sin demoras
    types: [update-news, cron-trigger]

# Otorgar permisos de escritura al token de GitHub Actions para permitir el git push
permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cachear binarios de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-v2-
            ${{ runner.os }}-playwright-

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador Chromium para Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Ejecutar script de reposición de noticias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/update-news.js

      - name: Publicar Tweet en X (Twitter)
        id: tweet-step
        continue-on-error: true
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TWITTER_AUTH_MULTI: ${{ secrets.TWITTER_AUTH_MULTI }}
          HEADLESS: 'true'
        run: node scripts/post-tweet.js

      - name: Reportar estado del Tweet
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("./tweet-result.json")) {
              const res = JSON.parse(fs.readFileSync("./tweet-result.json", "utf8"));
              if (res.success) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n### ✅ Tweet publicado exitosamente en X\n");
              } else {
                console.log("::warning::⚠️ Tweet no publicado: " + res.message);
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n### ⚠️ Tweet NO publicado\n**Causa:** " + res.message + "\n");
              }
            } else {
              console.log("::warning::⚠️ No se generó reporte de tweet.");
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n### ⚠️ Tweet NO publicado\nEl script de Twitter no pudo inicializar la sesión.\n");
            }
          '

      - name: Commitear y Subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            echo "💾 Cambios detectados. Guardando y subiendo a GitHub..."
            git commit -m "Auto: actualización de noticias y páginas estáticas"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ Cambios subidos exitosamente a GitHub."
          else
            echo "ℹ️ No se detectaron cambios para commitear en esta ejecución."
          fi

      - name: Mostrar Borrador de Tweet para X
        if: always()
        run: |
          if [ -f tweet.txt ]; then
            echo "### 🗞️ Panorama.ar — Automatización de Noticias" >> $GITHUB_STEP_SUMMARY
            echo "El sitio web de Panorama.ar se ha actualizado con éxito con noticias frescas de hoy." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 🐦 Borrador del Tweet sugerido para X:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat tweet.txt >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "*Tip: ¡Solo copialo y pegalo en tu cuenta de X!*" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🗞️ Panorama.ar — Automatización de Noticias" >> $GITHUB_STEP_SUMMARY
            echo "No se encontraron nuevas noticias hoy o no se pudo generar el borrador de Tweet." >> $GITHUB_STEP_SUMMARY
          fi
