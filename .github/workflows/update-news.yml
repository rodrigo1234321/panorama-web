name: Auto Actualizar Noticias

on:
  schedule:
    # Se ejecuta automáticamente cada 2 horas en el minuto 17 (fallback nativo)
    - cron: '17 */2 * * *'
  workflow_dispatch: # Permite disparar la automatización manualmente desde GitHub
  repository_dispatch: # Permite disparar la automatización externamente (cron-job.org, Webhook, API) sin demoras
    types: [update-news, cron-trigger]

# Otorgar permisos de escritura al token de GitHub Actions para permitir el git push
permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cachear binarios de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-v2-
            ${{ runner.os }}-playwright-

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador Chromium para Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Ejecutar script de reposición de noticias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/update-news.js

      - name: Publicar Tweet en X (Twitter)
        id: tweet-step
        continue-on-error: true
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TWITTER_AUTH_MULTI: ${{ secrets.TWITTER_AUTH_MULTI }}
          HEADLESS: 'true'
        run: node scripts/post-tweet.js

      - name: Reportar estado del Tweet
        if: always()
        run: |
          if [ "${{ steps.tweet-step.outcome }}" == "failure" ]; then
            echo "::warning::⚠️ El tweet no se pudo publicar. Verificar TWITTER_AUTH_TOKEN."
            echo "### ⚠️ Tweet NO publicado" >> $GITHUB_STEP_SUMMARY
            echo "El script de publicación en X falló. Posibles causas: token expirado, rate limit o cambio en la UI de Twitter." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Tweet publicado exitosamente" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commitear y Subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json noticias.json notas/ img/ trends.json sitemap.xml robots.txt tweet.txt
          # Solo hacer commit si el archivo noticias.json o las notas cambiaron
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: actualización de noticias y páginas estáticas" && git push)

      - name: Mostrar Borrador de Tweet para X
        if: always()
        run: |
          if [ -f tweet.txt ]; then
            echo "### 🗞️ Panorama.ar — Automatización de Noticias" >> $GITHUB_STEP_SUMMARY
            echo "El sitio web de Panorama.ar se ha actualizado con éxito con noticias frescas de hoy." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 🐦 Borrador del Tweet sugerido para X:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat tweet.txt >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "*Tip: ¡Solo copialo y pegalo en tu cuenta de X!*" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🗞️ Panorama.ar — Automatización de Noticias" >> $GITHUB_STEP_SUMMARY
            echo "No se encontraron nuevas noticias hoy o no se pudo generar el borrador de Tweet." >> $GITHUB_STEP_SUMMARY
          fi
